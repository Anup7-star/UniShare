name: unishare
description: "UniShare - Verified peer-to-peer campus platform for deliveries and rentals"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0

  # UI & Design
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^1.2.0+3

  # QR Code
  qr_flutter: ^4.1.0

  # Storage
  shared_preferences: ^2.3.4

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
